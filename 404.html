<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Hoan Nguyen</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100svh; display: grid; place-items: center; }
    .error-shell { width: min(calc(100% - 36px), 720px); padding: 4rem; border: 1px solid var(--border); border-radius: 30px; background: var(--bg-elevated); box-shadow: var(--shadow); text-align: center; }
    .error-shell strong { display: block; color: var(--accent); font-family: var(--serif); font-size: clamp(5rem, 18vw, 10rem); font-weight: 500; line-height: 0.8; }
    .error-shell h1 { margin: 1.5rem 0 1rem; font-size: clamp(2.3rem, 7vw, 4rem); }
    .error-shell p { color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="error-shell">
    <strong>404</strong>
    <h1>This leaf is missing.</h1>
    <p>The requested page could not be found.</p>
    <a class="button" href="./">Return home</a>
  </main>
</body>
</html>
